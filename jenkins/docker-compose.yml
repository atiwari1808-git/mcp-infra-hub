services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/eihwatb/.config/gcloud:/root/.config/gcloud   # <-- your ADC, read-only
volumes:
  jenkins_home:


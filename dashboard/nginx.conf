server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ { proxy_pass http://audit-api:8080/api/; }

    location /ai/ {
        proxy_pass http://ai-host:9000/;
        proxy_read_timeout 120s;          # Gemini calls can take a few seconds
    }
}


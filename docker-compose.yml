services:
  postgres:
    image: postgres:16
    container_name: mcp_audit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: mcp_audit
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:                               # let others wait for DB readiness
      test: ["CMD-SHELL", "pg_isready -U mcp_admin -d mcp_audit"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-server:
    build: ./server
    container_name: mcp_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres            # <-- service name, not localhost
      DB_PORT: 5432
      DB_NAME: mcp_audit
      DB_USER: mcp_admin
      DB_PASSWORD: supersecret
      GCP_PROJECT_ID: your-project-id
    depends_on:
      postgres:
        condition: service_healthy

  audit-api:
    build: ./api
    container_name: audit_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres            # <-- service name, not localhost
      DB_PORT: 5432
      DB_NAME: mcp_audit
      DB_USER: mcp_admin
      DB_PASSWORD: supersecret
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "3000:80"                  # visit http://localhost:3000

volumes:
  pg_data:

